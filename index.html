<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="3; url=./MIC_NSW_complete_fixed.html" />
    <title>Hashed Site</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        padding: 24px;
      }

      .card {
        width: min(100%, 560px);
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.25);
        text-align: center;
      }

      h1 { margin: 0 0 12px; font-size: 2rem; }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
      .btn {
        display: inline-block;
        text-decoration: none;
        background: var(--accent);
        color: #06202d;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
        transition: transform 0.2s ease;
      }
      .btn:hover { transform: translateY(-2px); }
      .small { margin-top: 16px; font-size: 0.95rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome to Hashed</h1>
      <p>Your website is ready. You will be redirected automatically to the main page shortly.</p>
      <a class="btn" href="./MIC_NSW_complete_fixed.html">Open Website</a>
      <div class="small">If the automatic redirect does not work, click the button above.</div>
    </main>
  </body>
</html>
